<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Node Todo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <header>
      <h1>Todo</h1>
      <p class="sub">Express + Docker + GitHub Actions + Render</p>
    </header>

    <form id="add-form">
      <input id="new-text" type="text" placeholder="เพิ่มงานใหม่..." maxlength="200" autocomplete="off" required>
      <button type="submit">เพิ่ม</button>
    </form>

    <ul id="list"></ul>
    <p id="empty" class="empty" hidden>ยังไม่มีงาน ลองเพิ่มดูสิ</p>
    <p id="error" class="error" hidden></p>

    <footer>
      <span id="count"></span>
      <span id="info"></span>
    </footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
